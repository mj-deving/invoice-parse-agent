services:
  qdrant:
    image: qdrant/qdrant:v1.15.5
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  invoice-parse-agent:
    build: .
    ports:
      - "8787:8787"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: claude-haiku-4-5
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: invoice_parse_agent
    depends_on:
      - qdrant

volumes:
  qdrant_data:
